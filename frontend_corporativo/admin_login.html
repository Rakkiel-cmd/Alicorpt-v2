<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acceso Administrador | Alicorp</title>
    <link rel="stylesheet" href="estilos.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">
</head>
<body>
    <div class="login-container">
        <div class="login-box">
            <h2 style="color: var(--color-primary); margin-bottom: 20px;">Seguridad Biométrica</h2>
            <p>Acceso restringido para administradores autorizados.</p>
            
            <div style="display: flex; flex-direction: column; gap: 20px;">
                <!-- SECCIÓN: LOGIN TRADICIONAL -->
                <div style="border: 1px solid #e2e8f0; padding: 20px; border-radius: 10px; text-align: left;">
                    <h3 style="color: var(--color-primary); margin-bottom: 15px; font-size: 1.1rem;">👤 Ingreso Clásico</h3>
                    <input type="text" id="inputUsuario" placeholder="Usuario" style="width: 100%; padding: 10px; margin-bottom: 10px; border: 1px solid #cbd5e1; border-radius: 5px;">
                    
                    <div style="position: relative; width: 100%; margin-bottom: 15px;">
                        <input type="password" id="inputPassword" placeholder="Contraseña" style="width: 100%; padding: 10px; border: 1px solid #cbd5e1; border-radius: 5px; padding-right: 40px;">
                        <button id="btnTogglePassword" type="button" style="position: absolute; right: 10px; top: 50%; transform: translateY(-50%); background: none; border: none; cursor: pointer; font-size: 1.2rem; color: #64748b;">👁️</button>
                    </div>

                    <button id="btnTradicional" class="btn-primary" style="width: 100%; border: none; cursor: pointer;">Ingresar con Contraseña</button>
                    <p id="statusTradicional" style="font-size: 0.85rem; margin-top: 10px;"></p>
                </div>

                <div style="text-align: center; color: #94a3b8; font-weight: bold;">O</div>

                <!-- SECCIÓN: LOGIN BIOMÉTRICO -->
                <div style="border: 1px solid #e2e8f0; padding: 20px; border-radius: 10px;">
                    <h3 style="color: var(--color-primary); margin-bottom: 15px; font-size: 1.1rem;">📷 Reconocimiento Facial</h3>
                    
                    <button id="btnEncenderCamara" class="btn-admin" style="width: 100%; cursor: pointer; margin-bottom: 15px;">📹 Activar Cámara</button>

                    <div id="contenedorVideo" style="display: none; position: relative;">
                        <div class="video-container" style="position: relative; border: 2px dashed var(--color-primary); border-radius: 10px; overflow: hidden; background-color: #000;">
                            <video id="videoElement" autoplay playsinline style="width: 100%; max-height: 250px; display: block;"></video>
                            <canvas id="canvasElement" style="display: none;"></canvas>
                        </div>
                        
                        <p id="statusMensaje" style="font-size: 0.9rem; color: #666; margin-bottom: 20px; margin-top: 10px;">
                            Cargando cámara...
                        </p>

                        <button id="btnCapturar" class="btn-primary" style="width: 100%; border: none; cursor: pointer; background-color: var(--color-primary);">Validar Identidad</button>
                    </div>
                </div>
            </div>

            <div style="margin-top: 30px;">
                <a href="index.html" class="btn-admin" style="display: inline-block;">← Volver al Inicio</a>
            </div>
        </div>
    </div>

    <!-- Script para ambos métodos de login -->
    <script>
        // --- LÓGICA TRADICIONAL ---
        const btnTradicional = document.getElementById('btnTradicional');
        const inputUsuario = document.getElementById('inputUsuario');
        const inputPassword = document.getElementById('inputPassword');
        const statusTradicional = document.getElementById('statusTradicional');
        const btnTogglePassword = document.getElementById('btnTogglePassword');

        // Mostrar/Ocultar contraseña
        btnTogglePassword.addEventListener('click', () => {
            if (inputPassword.type === 'password') {
                inputPassword.type = 'text';
                btnTogglePassword.innerHTML = '🙈'; // Cambiar icono
            } else {
                inputPassword.type = 'password';
                btnTogglePassword.innerHTML = '👁️';
            }
        });

        btnTradicional.addEventListener('click', () => {
            statusTradicional.innerHTML = "Verificando... ⏳";
            btnTradicional.disabled = true;

            fetch('/api/login_password', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    usuario: inputUsuario.value,
                    password: inputPassword.value
                })
            })
            .then(res => res.json())
            .then(data => {
                if (data.success) {
                    statusTradicional.innerHTML = `<span style='color:green;'>✅ ${data.message}</span>`;
                    setTimeout(() => window.location.href = data.redirect, 1000);
                } else {
                    statusTradicional.innerHTML = `<span style='color:red;'>❌ ${data.message}</span>`;
                    btnTradicional.disabled = false;
                }
            })
            .catch(err => {
                statusTradicional.innerHTML = `<span style='color:red;'>❌ Error de red.</span>`;
                btnTradicional.disabled = false;
            });
        });

        // --- LÓGICA BIOMÉTRICA ---
        const video = document.getElementById('videoElement');
        const canvas = document.getElementById('canvasElement');
        const btnCapturar = document.getElementById('btnCapturar');
        const statusMensaje = document.getElementById('statusMensaje');
        const btnEncenderCamara = document.getElementById('btnEncenderCamara');
        const contenedorVideo = document.getElementById('contenedorVideo');

        // Evento para encender la cámara manualmente
        btnEncenderCamara.addEventListener('click', () => {
            btnEncenderCamara.style.display = 'none'; // Ocultar boton de encender
            contenedorVideo.style.display = 'block'; // Mostrar el video
            statusMensaje.innerHTML = "Solicitando permisos de cámara... ⏳";

            navigator.mediaDevices.getUserMedia({ video: true })
                .then(stream => {
                    video.srcObject = stream;
                    statusMensaje.innerHTML = "Cámara lista. Ubica tu rostro y valida.";
                })
                .catch(err => {
                    console.error("Error accediendo a la cámara: ", err);
                    statusMensaje.innerHTML = "<span style='color:red;'>No se pudo acceder a la cámara. Revisa los permisos de tu navegador.</span>";
                    btnCapturar.disabled = true;
                });
        });

        // Evento al dar clic en validar
        btnCapturar.addEventListener('click', () => {
            statusMensaje.innerHTML = "Analizando rostro... 🤖";
            btnCapturar.disabled = true;

            // Dibujar el fotograma actual del video en el canvas
            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;
            canvas.getContext('2d').drawImage(video, 0, 0, canvas.width, canvas.height);
            
            // Convertir la imagen a Base64 para enviarla
            const imageData = canvas.toDataURL('image/jpeg');

            // Enviar la imagen al backend en Python (Flask)
            fetch('/api/login_facial', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({ image: imageData })
            })
            .then(response => response.json())
            .then(data => {
                if (data.success) {
                    statusMensaje.innerHTML = `<span style='color:green;'>✅ ${data.message}</span>`;
                    // Redirigir al dashboard tras 1 segundo
                    setTimeout(() => {
                        window.location.href = data.redirect;
                    }, 1000);
                } else {
                    statusMensaje.innerHTML = `<span style='color:red;'>❌ ${data.message}</span>`;
                    btnCapturar.disabled = false;
                }
            })
            .catch(error => {
                statusMensaje.innerHTML = `<span style='color:red;'>❌ Error de red con el servidor Python.</span>`;
                btnCapturar.disabled = false;
            });
        });
    </script>
</body>
</html>
