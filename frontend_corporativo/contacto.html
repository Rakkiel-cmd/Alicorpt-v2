<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contacto | Alicorp</title>
    <link rel="stylesheet" href="estilos.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800&display=swap" rel="stylesheet">
</head>
<body>
    <header class="navbar">
        <div class="container nav-container">
            <div class="logo"><a href="index.html" style="text-decoration: none;"><span class="logo-red">à</span><span class="logo-blue">licorp</span></a></div>
            <nav class="nav-links">
                <a href="inversionistas.html">Inversionistas</a>
                <a href="clientes.html">Clientes y proveedores</a>
                <a href="contacto.html" style="color: var(--color-secondary);">Contacto</a>
                <a href="etica.html">Unico Ética Alicorp</a>
                <a href="#">Perú ▾</a>
            </nav>
            <div class="nav-actions"><a href="admin_login.html" class="btn-outline">Personal Autorizado</a></div>
        </div>
    </header>

    <section class="section container" style="text-align: center; max-width: 600px;">
        <h1 class="section-title">Estamos para escucharte</h1>
        <p class="institucional-text">Si tienes alguna consulta sobre nuestros productos o quieres formar parte de nuestro equipo, escríbenos.</p>
        <div style="background: #fff; padding: 40px; border-radius: 15px; box-shadow: 0 10px 30px rgba(0,0,0,0.05); text-align: left;">
            <input type="text" placeholder="Nombre completo" style="width: 100%; padding: 15px; margin-bottom: 15px; border: 1px solid #ccc; border-radius: 5px;">
            <input type="email" placeholder="Correo electrónico" style="width: 100%; padding: 15px; margin-bottom: 15px; border: 1px solid #ccc; border-radius: 5px;">
            <textarea placeholder="Mensaje" rows="5" style="width: 100%; padding: 15px; margin-bottom: 20px; border: 1px solid #ccc; border-radius: 5px;"></textarea>
            <button class="btn-pill btn-primary" style="width: 100%;">Enviar Mensaje</button>
        </div>
    </section>
</body>
