<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro de Personal | Alicorp BI</title>
    <link rel="icon" type="image/x-icon" href="/compartido/favicon.ico">
    <link rel="apple-touch-icon" href="/compartido/favicon.png">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script>
        (function() {
            try {
                if (localStorage.getItem('alicorp_tema') === 'dark') {
                    document.documentElement.classList.add('dark-mode');
                }
            } catch (e) {}
        })();
    </script>
    <link rel="stylesheet" href="/acceso_seguridad/acceso_theme.css">
</head>
<body>
    <!-- Fondo Fijo Global de Olas Marinas SVG (Light & Dark) -->
    <div class="ocean-waves-bg" aria-hidden="true">
        <div class="wave-layer wave-layer-1">
            <div class="wave-track wave-track-1">
                <svg class="wave-svg" viewBox="0 0 2880 320" preserveAspectRatio="none">
                    <defs><linearGradient id="regWave1" x1="0%" y1="0%" x2="0%" y2="100%"><stop offset="0%" class="wave-stop-1-start"/><stop offset="100%" class="wave-stop-1-end"/></linearGradient></defs>
                    <path fill="url(#regWave1)" d="M0,110 Q360,20 720,110 T1440,110 T2160,110 T2880,110 L2880,320 L0,320 Z"/>
                </svg>
            </div>
        </div>
        <div class="wave-layer wave-layer-2">
            <div class="wave-track wave-track-2">
                <svg class="wave-svg" viewBox="0 0 2880 320" preserveAspectRatio="none">
                    <defs><linearGradient id="regWave2" x1="0%" y1="0%" x2="0%" y2="100%"><stop offset="0%" class="wave-stop-2-start"/><stop offset="100%" class="wave-stop-2-end"/></linearGradient></defs>
                    <path fill="url(#regWave2)" d="M0,130 Q180,210 360,130 T720,130 T1080,130 T1440,130 T1800,130 T2160,130 T2520,130 T2880,130 L2880,320 L0,320 Z"/>
                </svg>
            </div>
        </div>
        <div class="wave-layer wave-layer-3">
            <div class="wave-track wave-track-3">
                <svg class="wave-svg" viewBox="0 0 2880 320" preserveAspectRatio="none">
                    <defs><linearGradient id="regWave3" x1="0%" y1="0%" x2="0%" y2="100%"><stop offset="0%" class="wave-stop-3-start"/><stop offset="100%" class="wave-stop-3-end"/></linearGradient></defs>
                    <path fill="url(#regWave3)" d="M0,155 C240,65 480,245 720,155 C960,65 1200,245 1440,155 C1680,65 1920,245 2160,155 C2400,65 2640,245 2880,155 L2880,320 L0,320 Z"/>
                </svg>
            </div>
        </div>
    </div>

    <header class="auth-topbar">
        <a href="/portal_institucional/index.html" class="auth-brand-pill" title="Volver al portal institucional">
            <span class="auth-brand-mark" aria-hidden="true">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2L2 7l10 5 10-5-10-5z"/><path d="M2 17l10 5 10-5"/><path d="M2 12l10 5 10-5"/></svg>
            </span>
            <span>Alicorp BI</span>
        </a>
        <button type="button" class="theme-toggle-pill" id="themeToggleBtn" aria-label="Alternar tema claro u oscuro">
            <span id="themeIcon" aria-hidden="true"></span>
            <span id="themeText">Modo Oscuro</span>
        </button>
    </header>

    <main class="auth-shell">
        <div class="auth-card login-box">
            <div class="auth-header">
                <span class="auth-chip">Enrolamiento Biométrico 128-D</span>
                <h1>Registro de Personal</h1>
                <p>Alta corporativa con credenciales y huella vectorial facial.</p>
            </div>

            <div id="paso1">
                <div class="auth-bento-box">
                    <h2 class="auth-bento-title">
                        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
                        1. Credenciales y Datos Personales
                    </h2>

                    <label class="auth-label" for="inputNombreCompleto">Nombres y Apellidos Completos</label>
                    <input type="text" id="inputNombreCompleto" class="auth-input" placeholder="Ej: Manuel Jesús Sánchez Paredes" required>

                    <label class="auth-label" for="inputUsuario">Usuario Corporativo</label>
                    <input type="text" id="inputUsuario" class="auth-input" placeholder="Ej: msanchez" required>

                    <label class="auth-label" for="inputPassword">Contraseña</label>
                    <input type="password" id="inputPassword" class="auth-input" placeholder="Crea una contraseña segura" required>

                    <button id="btnSiguiente" type="button" class="auth-btn-primary">Siguiente: Captura Facial 128-D</button>
                    <p id="errorCredenciales" class="auth-status" style="color:var(--danger); display:none; margin-bottom:0;"></p>
                </div>
            </div>

            <div id="paso2" style="display: none;">
                <div class="auth-bento-box">
                    <h2 class="auth-bento-title">
                        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 7V5a2 2 0 0 1 2-2h2"/><path d="M17 3h2a2 2 0 0 1 2 2v2"/><path d="M21 17v2a2 2 0 0 1-2 2h-2"/><path d="M7 21H5a2 2 0 0 1-2-2v-2"/><circle cx="12" cy="10" r="3"/><path d="M7 18a5 5 0 0 1 10 0"/></svg>
                        2. Captura Facial Obligatoria
                    </h2>

                    <div class="bio-viewport" id="bioViewportReg">
                        <video id="videoElement" autoplay playsinline></video>
                        <svg class="bio-svg-guide" viewBox="0 0 400 260" preserveAspectRatio="none" aria-hidden="true">
                            <defs>
                                <mask id="faceCutoutReg">
                                    <rect width="400" height="260" fill="white"/>
                                    <ellipse cx="200" cy="130" rx="74" ry="96" fill="black"/>
                                </mask>
                            </defs>
                            <rect width="400" height="260" fill="rgba(7,10,18,0.46)" mask="url(#faceCutoutReg)"/>
                            <ellipse cx="200" cy="130" rx="74" ry="96" fill="none" stroke="rgba(255,255,255,0.78)" stroke-width="2" stroke-dasharray="6 5"/>
                        </svg>
                        <div class="scan-line" id="scanLine"></div>
                        <canvas id="canvasElement" style="display: none;"></canvas>
                    </div>

                    <p id="statusMensaje" class="auth-status">Ubica tu rostro dentro del óvalo guía.</p>

                    <div id="botonesCaptura">
                        <button id="btnTomarFoto" type="button" class="auth-btn-primary">Analizar Calidad del Rostro</button>
                    </div>

                    <div id="botonesConfirmacion" style="display: none; gap: 10px;">
                        <button id="btnReintentar" type="button" class="auth-btn-secondary">Repetir Toma</button>
                        <button id="btnGuardar" type="button" class="auth-btn-primary success">Guardar Registro</button>
                    </div>
                </div>
            </div>

            <div class="auth-footer-links">
                <a href="/acceso_seguridad/admin_login.html" class="auth-link">← Volver al Login</a>
                <a href="/portal_institucional/index.html" class="auth-link">Portal Público</a>
            </div>
        </div>
    </main>

    <script>
        // --- MOTOR DE TEMA LIGHT/DARK ---
        (function initTheme() {
            const SVG_SUN = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>';
            const SVG_MOON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>';
            const btn = document.getElementById('themeToggleBtn');
            const ico = document.getElementById('themeIcon');
            const txt = document.getElementById('themeText');

            function aplicar(dark, guardar) {
                document.documentElement.classList.toggle('dark-mode', dark);
                document.body.classList.toggle('dark-mode', dark);
                if (ico) ico.innerHTML = dark ? SVG_SUN : SVG_MOON;
                if (txt) txt.textContent = dark ? 'Modo Claro' : 'Modo Oscuro';
                if (guardar) { try { localStorage.setItem('alicorp_tema', dark ? 'dark' : 'light'); } catch (e) {} }
            }
            aplicar(document.documentElement.classList.contains('dark-mode'), false);
            if (btn) btn.addEventListener('click', () => aplicar(!document.documentElement.classList.contains('dark-mode'), true));
        })();

        // --- PROTECCIÓN DE ACCESO ---
        (async function verificarAccesoRegistro() {
            const ses = sessionStorage.getItem('usuario_activo') || localStorage.getItem('usuario_activo');
            if (ses) return;

            const urlObj = new URL(window.location.href);
            const keyParam = urlObj.searchParams.get('key') || urlObj.searchParams.get('clave') || urlObj.searchParams.get('access') || urlObj.searchParams.get('token');
            if (keyParam) {
                try {
                    const resp = await fetch('/api/seguridad/validar_key', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ key: keyParam.trim() })
                    });
                    const data = await resp.json();
                    if (resp.ok && data.success && data.desbloqueado) {
                        const keyLimpia = keyParam.trim();
                        sessionStorage.setItem('empleado_desbloqueado', 'true');
                        sessionStorage.setItem('llave_personal_activa', keyLimpia);
                        localStorage.setItem('empleado_desbloqueado', 'true');
                        localStorage.setItem('empleado_desbloqueado_timestamp', Date.now().toString());
                        localStorage.setItem('llave_personal_activa', keyLimpia);

                        urlObj.searchParams.delete('key');
                        urlObj.searchParams.delete('clave');
                        urlObj.searchParams.delete('access');
                        urlObj.searchParams.delete('token');
                        window.history.replaceState({}, document.title, urlObj.pathname + (urlObj.search ? urlObj.search : ''));
                        return;
                    }
                } catch (e) {}
            }

            if (sessionStorage.getItem('empleado_desbloqueado') === 'true') return;
            if (localStorage.getItem('empleado_desbloqueado') === 'true') {
                const ts = parseInt(localStorage.getItem('empleado_desbloqueado_timestamp') || '0', 10);
                if (ts && (Date.now() - ts) < 8 * 3600 * 1000) {
                    sessionStorage.setItem('empleado_desbloqueado', 'true');
                    return;
                }
            }

            document.body.innerHTML = `
                <div style="font-family:'Plus Jakarta Sans',sans-serif; min-height:100vh; display:flex; align-items:center; justify-content:center; padding:20px;">
                    <div class="auth-card" style="max-width:440px; text-align:center;">
                        <h2 style="color:var(--danger); margin:0 0 8px; font-weight:800;">Acceso Restringido</h2>
                        <p style="color:var(--text-muted); font-size:14px; margin:0 0 22px;">Esta sección es exclusiva para personal autorizado de Corporación Alicorp. Redirigiendo al portal público...</p>
                        <a href="/portal_institucional/index.html" class="auth-btn-primary">Ir al Portal Público</a>
                    </div>
                </div>
            `;
            setTimeout(() => { window.location.replace("/portal_institucional/index.html"); }, 1800);
        })();

        const paso1 = document.getElementById('paso1');
        const paso2 = document.getElementById('paso2');
        const btnSiguiente = document.getElementById('btnSiguiente');
        const inputNombreCompleto = document.getElementById('inputNombreCompleto');
        const inputUsuario = document.getElementById('inputUsuario');
        const inputPassword = document.getElementById('inputPassword');
        const errorCredenciales = document.getElementById('errorCredenciales');

        const video = document.getElementById('videoElement');
        const canvas = document.getElementById('canvasElement');
        const scanLine = document.getElementById('scanLine');
        const statusMensaje = document.getElementById('statusMensaje');
        const btnTomarFoto = document.getElementById('btnTomarFoto');
        const bioViewport = document.getElementById('bioViewportReg');

        const botonesCaptura = document.getElementById('botonesCaptura');
        const botonesConfirmacion = document.getElementById('botonesConfirmacion');
        const btnReintentar = document.getElementById('btnReintentar');
        const btnGuardar = document.getElementById('btnGuardar');

        let imagenFinalBase64 = "";

        const setEstadoViewport = (estado) => {
            if (!bioViewport) return;
            bioViewport.classList.remove('state-scanning', 'state-match', 'state-error');
            if (estado) bioViewport.classList.add('state-' + estado);
        };

        btnSiguiente.addEventListener('click', () => {
            const nombre = inputNombreCompleto.value.trim();
            const usr = inputUsuario.value.trim();
            const pwd = inputPassword.value.trim();

            if (!nombre || !usr || !pwd) {
                errorCredenciales.textContent = "Completa tus Nombres y Apellidos, Usuario y Contraseña.";
                errorCredenciales.style.display = "block";
                return;
            }
            errorCredenciales.style.display = "none";
            paso1.style.display = 'none';
            paso2.style.display = 'block';

            navigator.mediaDevices.getUserMedia({ video: true })
                .then(stream => { video.srcObject = stream; })
                .catch(() => {
                    setEstadoViewport('error');
                    statusMensaje.innerHTML = '<span style="color:var(--danger);font-weight:700;">No se pudo acceder a la cámara.</span>';
                    btnTomarFoto.disabled = true;
                });
        });

        btnTomarFoto.addEventListener('click', () => {
            statusMensaje.textContent = "Analizando calidad biométrica...";
            setEstadoViewport('scanning');
            scanLine.classList.add('scanning');
            btnTomarFoto.disabled = true;

            canvas.width = video.videoWidth || 640;
            canvas.height = video.videoHeight || 480;
            canvas.getContext('2d').drawImage(video, 0, 0, canvas.width, canvas.height);
            const imageData = canvas.toDataURL('image/jpeg');

            fetch('/api/verificar_rostro', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ image: imageData })
            })
            .then(res => res.json())
            .then(data => {
                scanLine.classList.remove('scanning');
                if (data.success) {
                    setEstadoViewport('match');
                    imagenFinalBase64 = imageData;
                    statusMensaje.innerHTML = `<span style="color:var(--success);font-weight:700;">${data.message}</span>`;
                    video.pause();
                    botonesCaptura.style.display = 'none';
                    botonesConfirmacion.style.display = 'flex';
                } else {
                    setEstadoViewport('error');
                    statusMensaje.innerHTML = `<span style="color:var(--danger);font-weight:700;">${data.message} Inténtalo de nuevo.</span>`;
                    btnTomarFoto.disabled = false;
                }
            })
            .catch(() => {
                scanLine.classList.remove('scanning');
                setEstadoViewport('error');
                statusMensaje.innerHTML = '<span style="color:var(--danger);font-weight:700;">Error de servidor al analizar rostro.</span>';
                btnTomarFoto.disabled = false;
            });
        });

        btnReintentar.addEventListener('click', () => {
            setEstadoViewport('');
            video.play();
            statusMensaje.textContent = "Ubica tu rostro dentro del óvalo guía.";
            botonesConfirmacion.style.display = 'none';
            botonesCaptura.style.display = 'block';
            btnTomarFoto.disabled = false;
            imagenFinalBase64 = "";
        });

        btnGuardar.addEventListener('click', () => {
            statusMensaje.textContent = "Registrando en Supabase PostgreSQL...";
            btnGuardar.disabled = true;
            btnReintentar.disabled = true;

            fetch('/api/registrar_admin_web', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    nombre_completo: inputNombreCompleto.value.trim(),
                    usuario: inputUsuario.value.trim(),
                    password: inputPassword.value,
                    image: imagenFinalBase64
                })
            })
            .then(res => res.json())
            .then(data => {
                if (data.success) {
                    try {
                        sessionStorage.setItem('usuario_activo', JSON.stringify({
                            usuario: data.usuario || inputUsuario.value.trim(),
                            nombre_completo: data.nombre_completo || inputNombreCompleto.value.trim()
                        }));
                    } catch (e) {}
                    statusMensaje.innerHTML = `<span style="color:var(--success);font-weight:700;">Registro completado para ${data.nombre_completo || inputNombreCompleto.value}. Redirigiendo al login...</span>`;
                    setTimeout(() => { window.location.href = "/acceso_seguridad/admin_login.html"; }, 1800);
                } else {
                    setEstadoViewport('error');
                    statusMensaje.innerHTML = `<span style="color:var(--danger);font-weight:700;">Error: ${data.message}</span>`;
                    btnGuardar.disabled = false;
                    btnReintentar.disabled = false;
                }
            })
            .catch(() => {
                setEstadoViewport('error');
                statusMensaje.innerHTML = '<span style="color:var(--danger);font-weight:700;">Error de red al guardar registro.</span>';
                btnGuardar.disabled = false;
                btnReintentar.disabled = false;
            });
        });
    </script>
</body>
</html>
